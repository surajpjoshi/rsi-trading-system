name: RSI Trading System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # PHASE 4 - RSI SCANNER
      # ==========================================
      - name: Run RSI Scanner
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          echo "=========================================="
          echo "PHASE 4 - RSI SCANNER"
          echo "=========================================="
          python RSI_Scanner.py

      # ==========================================
      # PHASE 5B - OUTCOME TRACKING
      # ==========================================
      - name: Run Phase 5B Outcome Tracker
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          echo "=========================================="
          echo "PHASE 5B - OUTCOME TRACKER"
          echo "=========================================="
          python Phase5B_Outcome_Tracker.py

      # ==========================================
      # PHASE 6 - TRADING STATISTICS
      # ==========================================
      - name: Run Phase 6 Statistics
        run: |
          echo "=========================================="
          echo "PHASE 6 - TRADING STATISTICS"
          echo "=========================================="
          python Phase6_Trading_Statistics.py

      # ==========================================
      # COMMIT RESULTS
      # ==========================================
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=========================================="
          echo "ADDING OUTPUT FILES"
          echo "=========================================="

          git add latest_results.csv
          git add latest_results.json
          git add RSI_History.csv
          git add Setup_History.csv
          git add Trading_Statistics.csv
          git add Trading_Statistics_By_Tag.csv

          echo "=========================================="
          echo "CHECKING FOR CHANGES"
          echo "=========================================="

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RSI trading system"
            git push
          fi