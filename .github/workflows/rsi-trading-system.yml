name: RSI Trading System

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSI Scanner
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python RSI_Scanner.py

      - name: Run Phase 6 Statistics
        run: python Phase6_Trading_Statistics.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_results.csv latest_results.json RSI_History.csv
          git add RSI_Scanner_*.csv Trading_Statistics.csv Trading_Statistics_By_Tag.csv Setup_History.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update RSI trading system"
            git push
          fi
